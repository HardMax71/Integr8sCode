    "aiohttp==3.14.4",
    "aiosignal==1.4.0",
    "annotated-doc==0.0.5",
    "annotated-types==0.8.0",
    "anyio==4.15.1",
    "asgiref==3.12.1",
    "async-timeout==5.0.1",
    "attrs==26.1.0",
    "certifi==2026.7.22",
    "charset-normalizer==3.5.2",
    "click==8.5.0",
    "aiokafka==0.14.0",
    "Deprecated==3.0.0",
    "dishka==1.10.1",
