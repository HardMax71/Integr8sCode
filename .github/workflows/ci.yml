name: CI

# One workflow for every check, the way FastAPI, pydantic and CPython run theirs: on a PR the changes job decides what
# runs, and the last job, alls-green, is the one required status check. Pushes to main run everything.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ghcr.io
  K3S_IMAGE: rancher/k3s:v1.37.1-k3s1@sha256:ca7f37d993d82ef0dcdcfecb2e0e2618ea541dbaffc620c8cedebe01a82acd0d

jobs:
  changes:
    name: Changed Areas
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      backend: ${{ github.event_name != 'pull_request' || steps.filter.outputs.backend == 'true' }}
      frontend: ${{ github.event_name != 'pull_request' || steps.filter.outputs.frontend == 'true' }}
      infra: ${{ github.event_name != 'pull_request' || steps.filter.outputs.infra == 'true' }}
      observability: ${{ github.event_name != 'pull_request' || steps.filter.outputs.observability == 'true' }}
      api: ${{ github.event_name != 'pull_request' || steps.filter.outputs.api == 'true' }}
      docs: ${{ github.event_name != 'pull_request' || steps.filter.outputs.docs == 'true' }}
    steps:
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d  # v4.0.3
        id: filter
        if: github.event_name == 'pull_request'
        with:
          filters: |
            workflow: &workflow
              - '.github/workflows/ci.yml'
            backend:
              - *workflow
              - 'backend/**'
            frontend:
              - *workflow
              - 'frontend/**'
            infra:
              - *workflow
              - '.env.example'
              - 'docker-compose.yaml'
              - '.github/actions/**'
            # The configs of the observability services, each in the folder named after its compose service
            observability: &observability
              - *workflow
              - 'grafana/**'
              - 'host-metrics/**'
              - 'loki/**'
              - 'opensearch/**'
              - 'otel-collector/**'
              - 'victoria-metrics/**'
            api:
              - *workflow
              - 'backend/**'
              - 'docs/reference/openapi.json'
              - 'frontend/src/lib/api/**'
              - 'frontend/openapi-ts.config.ts'
              - 'frontend/package.json'
              - 'frontend/package-lock.json'
            # The docs include snippets of backend, frontend and observability files and build the spec from the backend
            docs:
              - *workflow
              - *observability
              - 'docs/**'
              - 'mkdocs.yml'
              - 'backend/**'
              - 'frontend/**'
              - 'docker-compose.yaml'

  ruff:
    name: Ruff Linting
    needs: [changes]
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: "backend/uv.lock"

      - name: Install Python and dependencies
        run: |
          cd backend
          uv python install 3.14
          uv sync --frozen --group lint --no-dev --no-install-project --no-build

      - name: Run ruff
        run: |
          cd backend
          uv run --no-sync --no-build ruff check . --config pyproject.toml

  mypy:
    name: Mypy Type Checking
    needs: [changes]
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: "backend/uv.lock"

      - name: Install Python and dependencies
        run: |
          cd backend
          uv python install 3.14
          uv sync --frozen --group lint --group test --no-dev --no-install-project --no-build

      - name: Run mypy
        env:
          SECRET_KEY: ${{ secrets.TEST_SECRET_KEY }}
        run: |
          cd backend
          uv run --no-sync --no-build mypy --config-file pyproject.toml --strict .

  grimp:
    name: Grimp Orphan Module Check
    needs: [changes]
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: "backend/uv.lock"

      - name: Install Python and dependencies
        run: |
          cd backend
          uv python install 3.14
          uv sync --frozen --group lint --no-dev --no-install-project --no-build

      - name: Run grimp orphan module check
        run: |
          cd backend
          uv run --no-sync --no-build python -m scripts.check_orphan_modules

  security:
    name: Security Scanning
    needs: [changes]
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: "backend/uv.lock"

      - name: Run bandit
        run: uvx --no-build --python 3.14 bandit==1.9.4 -r backend/ -x backend/tests/,backend/.venv/ -ll

  frontend:
    name: Frontend Lint & Type Check
    needs: [changes]
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: '26'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci --ignore-scripts

      - name: Run ESLint
        working-directory: frontend
        run: npm run lint

      - name: Run Stylelint
        working-directory: frontend
        run: npm run stylelint

      - name: Check formatting (Prettier)
        working-directory: frontend
        run: npm run format:check

      - name: Run svelte-check
        working-directory: frontend
        run: npm run check

      - name: Verify production build
        working-directory: frontend
        run: npm run build

  generated-api:
    name: Spec and client match the code
    needs: [changes]
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: "backend/uv.lock"

      - name: Install backend dependencies
        run: |
          cd backend
          uv python install 3.14
          uv sync --frozen --no-dev --no-install-project --no-build

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: '26'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --ignore-scripts

      - name: Regenerate the spec and the client
        run: |
          (cd backend && uv run --no-sync --no-build python -m scripts.export_openapi)
          cd frontend && npm run generate:api

      - name: Fail on any difference
        run: |
          changes=$(git status --porcelain -- docs/reference/openapi.json frontend/src/lib/api)
          if [ -n "$changes" ]; then
            echo "::error::docs/reference/openapi.json and frontend/src/lib/api must come from the generators, never from hand edits. Run uv run python -m scripts.export_openapi in backend/, then npm run generate:api in frontend/, and commit the result."
            echo "$changes"
            git diff --stat -- docs/reference/openapi.json frontend/src/lib/api
            exit 1
          fi

  docs:
    name: Docs Build
    needs: [changes]
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          enable-cache: true

      - name: Install backend dependencies
        run: cd backend && uv sync --frozen --no-dev --no-install-project --no-build

      - name: Generate OpenAPI spec
        run: cd backend && uv run --no-sync --no-build python -m scripts.export_openapi

      - name: Build documentation
        run: >-
          uvx --no-build --from mkdocs==1.6.1
          --with mkdocs-material==9.7.7
          --with mkdocs-mermaid2-plugin==1.2.3
          --with mkdocs-swagger-ui-tag==0.8.1
          mkdocs build --strict

      - name: Upload artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: site/

  docs-deploy:
    name: Deploy Docs
    needs: [docs]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
      deployments: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1

      # GitHub deletes only inactive deployments, so each older one is marked inactive first
      - name: Delete the previous docs deployments
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for id in $(gh api "repos/$GITHUB_REPOSITORY/deployments?environment=github-pages&per_page=100" --jq 'sort_by(.created_at) | reverse | .[1:][].id'); do
            gh api -X POST "repos/$GITHUB_REPOSITORY/deployments/$id/statuses" -f state=inactive > /dev/null
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/deployments/$id" > /dev/null
          done

  # Fast unit tests (no infrastructure needed)
  backend-unit:
    name: Backend Unit Tests
    needs: [changes]
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: "backend/uv.lock"

      - name: Install Python dependencies
        run: |
          cd backend
          uv python install 3.14
          uv sync --frozen --group test --no-dev --no-install-project --no-build

      - name: Run unit tests
        timeout-minutes: 5
        run: |
          cd backend
          uv run --no-sync --no-build pytest tests/unit -v -rs \
            --durations=0 \
            --cov=app \
            --cov-report=xml --cov-report=term

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5  # v7.1.1
        if: always()
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: backend/coverage.xml
          flags: backend-unit
          name: backend-unit-coverage
          fail_ci_if_error: false
          verbose: true

  # Every metric a dashboard or alert rule reads exists, and every metric the collector makes is read
  grafana-contract:
    name: Grafana Contract Tests
    needs: [changes]
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.observability == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: "backend/uv.lock"

      - name: Install Python dependencies
        run: |
          cd backend
          uv python install 3.14
          uv sync --frozen --group test --no-dev --no-install-project --no-build

      - name: Run Grafana contract tests
        timeout-minutes: 2
        run: |
          cd backend
          uv run --no-sync --no-build pytest tests/contract -v -rs -m grafana_contract

  frontend-unit:
    name: Frontend Unit Tests
    needs: [changes]
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: '26'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci --ignore-scripts

      - name: Run unit tests with coverage
        working-directory: frontend
        run: npm run test:coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5  # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: frontend/coverage/lcov.info
          flags: frontend-unit
          name: frontend-unit-coverage
          fail_ci_if_error: false
          verbose: true

  # Build all images, push to GHCR with immutable SHA tag.
  # Fork PRs skip GHCR push (no write access) — E2E tests require pushed images.
  build-images:
    name: Build & Push Images
    needs: [changes, backend-unit, frontend-unit]
    # Runs when a unit job passed or was skipped, not after a failure
    if: >-
      !cancelled() && !failure() &&
      (needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true' ||
      needs.changes.outputs.infra == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      sha-tag: ${{ steps.tags.outputs.sha-tag }}
      image-prefix: ${{ steps.tags.outputs.image-prefix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - name: Log in to GHCR
        if: ${{ !github.event.pull_request.head.repo.fork }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: tags
        run: |
          PREFIX="${GITHUB_REPOSITORY_OWNER,,}/integr8scode"
          SHA_TAG="sha-${GITHUB_SHA::7}"
          echo "sha-tag=$SHA_TAG" >> "$GITHUB_OUTPUT"
          echo "image-prefix=$PREFIX" >> "$GITHUB_OUTPUT"

      # ── Base image (cached separately — rarely changes) ──────────────
      - name: Cache base image
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        id: base-cache
        with:
          path: /tmp/base-image.tar.zst
          key: base-image-${{ runner.os }}-${{ hashFiles('backend/Dockerfile', 'backend/pyproject.toml', 'backend/uv.lock') }}

      - name: Load base image from cache
        if: steps.base-cache.outputs.cache-hit == 'true'
        run: zstd -d -c /tmp/base-image.tar.zst | docker load

      - name: Build base image
        if: steps.base-cache.outputs.cache-hit != 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: ./backend
          file: ./backend/Dockerfile
          target: base
          load: true
          tags: integr8scode-base:latest
          cache-from: type=gha,scope=backend-base
          cache-to: type=gha,mode=max,scope=backend-base

      - name: Save base image to cache
        if: steps.base-cache.outputs.cache-hit != 'true'
        run: docker save integr8scode-base:latest | zstd -T0 -3 > /tmp/base-image.tar.zst

      # ── Backend (the cached base image stands in for the Dockerfile's base stage) ───────────────
      - name: Build backend image
        run: |
          docker build -t integr8scode-backend:latest \
            --build-context base=docker-image://integr8scode-base:latest \
            -f ./backend/Dockerfile ./backend

      # ── Frontend (nginx + SSL) ─────────────────────────────────────
      - name: Build frontend image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          load: true
          tags: integr8scode-frontend:latest
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
          # A cached `apk upgrade` layer would keep OS packages from the day it was cached
          no-cache-filters: production

      # ── Push all images to GHCR in parallel ────────────────────────
      - name: Push all images to GHCR
        if: ${{ !github.event.pull_request.head.repo.fork }}
        env:
          TAG: ${{ steps.tags.outputs.sha-tag }}
          IMG: ${{ env.REGISTRY }}/${{ steps.tags.outputs.image-prefix }}
        run: |
          # Tag all images for GHCR
          docker tag integr8scode-backend:latest "$IMG/backend:$TAG"
          docker tag integr8scode-frontend:latest "$IMG/frontend:$TAG"

          # Push both images in parallel, tracking each PID
          declare -A PIDS
          for name in backend frontend; do
            docker push "$IMG/$name:$TAG" &
            PIDS[$name]=$!
          done

          FAILED=0
          for name in "${!PIDS[@]}"; do
            if ! wait "${PIDS[$name]}"; then
              echo "::error::Failed to push $name"
              FAILED=1
            fi
          done
          [ "$FAILED" -eq 0 ] || exit 1

  # Parallel E2E test jobs — compose pulls from GHCR using IMAGE_TAG
  backend-e2e:
    name: Backend E2E Tests
    needs: [changes, build-images]
    # !cancelled() keeps a skipped unit job further up the chain from skipping this one
    if: >-
      !cancelled() && needs.build-images.result == 'success' &&
      !github.event.pull_request.head.repo.fork &&
      (needs.changes.outputs.backend == 'true' || needs.changes.outputs.infra == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Boot E2E environment
        uses: ./.github/actions/e2e-boot
        with:
          image-tag: ${{ needs.build-images.outputs.sha-tag }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Finalize k3s & start stack
        uses: ./.github/actions/e2e-ready
        with:
          image-tag: ${{ needs.build-images.outputs.sha-tag }}

      - name: Run E2E tests
        timeout-minutes: 15
        run: |
          docker compose exec -T backend \
            sh -c 'uv sync --group test --no-dev --frozen --no-install-project --no-build && pytest tests/e2e -v -rs \
            --durations=0 \
            --cov=app \
            --cov-report=xml:coverage-e2e.xml \
            --cov-report=term'

      - name: Copy coverage
        if: always()
        run: docker compose cp backend:/app/coverage-e2e.xml backend/coverage-e2e.xml || true

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5  # v7.1.1
        if: always()
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: backend/coverage-e2e.xml
          flags: backend-e2e
          name: backend-e2e-coverage
          fail_ci_if_error: false

      - name: Collect logs on failure
        if: failure()
        run: |
          mkdir -p logs
          docker compose logs --timestamps > logs/docker-compose.log 2>&1
          for svc in backend worker mongo redis kafka; do
            docker compose logs --timestamps "$svc" > "logs/$svc.log" 2>&1 || true
          done
          kubectl get events --sort-by='.metadata.creationTimestamp' -A > logs/k8s-events.log 2>&1 || true
          docker logs k3s > logs/k3s.log 2>&1 || true
          kubectl describe nodes > logs/k8s-nodes.log 2>&1 || true

      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: backend-e2e-logs
          path: logs/

  frontend-e2e:
    name: Frontend E2E (${{ matrix.shardIndex }}/${{ matrix.shardTotal }})
    needs: [build-images]
    # !cancelled() keeps a skipped unit job further up the chain from skipping this one
    if: >-
      !cancelled() && needs.build-images.result == 'success' &&
      !github.event.pull_request.head.repo.fork
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        shardIndex: [1, 2]
        shardTotal: [2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # Phase 1: kick off image pull + infra + k3s in background
      - name: Boot E2E environment
        uses: ./.github/actions/e2e-boot
        with:
          image-tag: ${{ needs.build-images.outputs.sha-tag }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # Phase 2: Node + Playwright setup (overlaps with k3s boot + image pull)
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: '26'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --ignore-scripts

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}

      - name: Install Playwright system dependencies
        working-directory: frontend
        run: npm run test:e2e:deps

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: frontend
        run: npm run test:e2e:browsers

      # Phase 3: finalize k3s + start stack (k3s has been booting since e2e-boot)
      - name: Finalize k3s & start stack
        uses: ./.github/actions/e2e-ready
        with:
          image-tag: ${{ needs.build-images.outputs.sha-tag }}
          wait-for-frontend: 'true'

      - name: Run Playwright tests
        timeout-minutes: 10
        working-directory: frontend
        run: npm run test:e2e -- --shard=${{ matrix.shardIndex }}/${{ matrix.shardTotal }}

      - name: Upload Playwright report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: always()
        with:
          name: playwright-report-${{ matrix.shardIndex }}
          path: frontend/playwright-report/

      - name: Collect logs on failure
        if: failure()
        run: |
          mkdir -p logs
          docker compose logs --timestamps > logs/docker-compose.log 2>&1
          for svc in backend frontend; do
            docker compose logs --timestamps "$svc" > "logs/$svc.log" 2>&1 || true
          done
          docker logs k3s > logs/k3s.log 2>&1 || true
          kubectl describe nodes > logs/k8s-nodes.log 2>&1 || true

      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: frontend-e2e-logs-${{ matrix.shardIndex }}
          path: logs/

  # https://github.com/marketplace/actions/alls-green#why: the one required check, so a job skipped because its files
  # didn't change counts as passed, while a failed or cancelled one fails it
  check:
    name: All checks pass
    if: always()
    needs:
      - changes
      - ruff
      - mypy
      - grimp
      - security
      - frontend
      - generated-api
      - docs
      - backend-unit
      - grafana-contract
      - frontend-unit
      - build-images
      - backend-e2e
      - frontend-e2e
    runs-on: ubuntu-latest
    steps:
      - uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35  # v1.3.0
        with:
          allowed-skips: >-
            ruff, mypy, grimp, security, frontend, generated-api, docs,
            backend-unit, grafana-contract, frontend-unit, build-images, backend-e2e, frontend-e2e
          jobs: ${{ toJSON(needs) }}
