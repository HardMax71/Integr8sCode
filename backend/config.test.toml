# Integr8sCode backend test configuration
# Differences from config.toml: lower timeouts, faster bcrypt, relaxed rate limits
# Secrets come from environment variables with dev defaults (see settings.py).

ENVIRONMENT = "test"
PROJECT_NAME = "integr8scode"
ALGORITHM = "HS256"
ACCESS_TOKEN_EXPIRE_MINUTES = 1440

KUBERNETES_CONFIG_PATH = "/etc/rancher/k3s/k3s.yaml"
K8S_POD_CPU_LIMIT = "1000m"
K8S_POD_MEMORY_LIMIT = "128Mi"
K8S_POD_CPU_REQUEST = "200m"
K8S_POD_MEMORY_REQUEST = "128Mi"
K8S_POD_EXECUTION_TIMEOUT = 5
K8S_NAMESPACE = "integr8scode"

RATE_LIMIT_ENABLED = false

SERVER_HOST = "0.0.0.0"

# Kafka (lower timeouts for tests)
KAFKA_BOOTSTRAP_SERVERS = "kafka:29092"
KAFKA_REQUEST_TIMEOUT_MS = 5000
KAFKA_GRACEFUL_TIMEOUT = 5.0

# SSE
SSE_CONSUMER_POOL_SIZE = 1

LOG_LEVEL = "WARNING"

# Tracing: no exporter in tests, so spans are created but not exported
OTLP_TRACES_ENDPOINT = ""
TRACING_SAMPLING_RATE = 1.0

CORS_ORIGINS = [
    "https://app.integr8scode.cc",
    "https://integr8scode.cc",
    "https://localhost:5001",
    "https://127.0.0.1:5001",
    "https://localhost",
    "https://127.0.0.1",
    "https://localhost:443",
    "https://127.0.0.1:443",
]

SERVICE_NAME = "integr8scode-backend"
SERVICE_VERSION = "1.0.0"

# Gunicorn / Uvicorn
WEB_CONCURRENCY = 1
WEB_TIMEOUT = 60
WEB_BACKLOG = 2048

BCRYPT_ROUNDS = 4
REDIS_MAX_CONNECTIONS = 200
