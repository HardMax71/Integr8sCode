name: 'E2E Ready'
description: 'Finalize k3s, wait for infra, start compose stack, health-check'

inputs:
  image-tag:
    description: 'GHCR image tag (e.g., sha-abc1234)'
    required: true
  wait-for-frontend:
    description: 'Also wait for frontend health check (default: false)'
    required: false
    default: 'false'

runs:
  using: 'composite'
  steps:
    - name: Finalize k3s
      shell: bash
      run: |
        mkdir -p /home/runner/.kube
        timeout 90 bash -c 'until [ -s /etc/rancher/k3s/k3s.yaml ]; do sleep 1; done'
        cp /etc/rancher/k3s/k3s.yaml /home/runner/.kube/config
        chmod 600 /home/runner/.kube/config
        export KUBECONFIG=/home/runner/.kube/config
        # kubectl wait fails at once while the node isn't registered yet, so retry until it is
        timeout 120 bash -c 'until kubectl wait --for=condition=Ready node --all --timeout=5s >/dev/null 2>&1; do sleep 2; done'

    - name: Wait for the executor image pull
      shell: bash
      run: |
        set -e
        timeout 120 tail --pid="$(cat /tmp/crictl-python.pid)" -f /dev/null 2>/dev/null || true
        cat /tmp/crictl-python.log 2>/dev/null || true
        [ "$(cat /tmp/crictl-python.exit)" = "0" ]

    - name: Prepare config, wait for infra
      shell: bash
      run: |
        set -e
        # compose reads .env for every later command, so the backend and the worker both run with the test settings
        echo BACKEND_CONFIG=config.test.toml >> .env

        timeout 120 tail --pid="$(cat /tmp/infra-pull.pid)" -f /dev/null 2>/dev/null || true
        cat /tmp/infra-pull.log 2>/dev/null || true
        [ "$(cat /tmp/infra-pull.exit)" = "0" ]

    - name: Start stack
      shell: bash
      env:
        IMAGE_TAG: ${{ inputs.image-tag }}
      # The app and what it depends on; no test uses the observability services, and their images are about 4 GB
      run: docker compose up -d --no-build frontend worker mongo-backup

    - name: Wait for services
      shell: bash
      env:
        WAIT_FOR_FRONTEND: ${{ inputs.wait-for-frontend }}
      run: |
        echo "Waiting for backend health..."
        timeout 120 bash -c 'until curl -ksf https://localhost/api/v1/health/live 2>/dev/null; do sleep 1; done'
        echo "Backend ready"
        # Most groups start at the newest message on a fresh Kafka, so anything sent before they join is never read
        for group in saga-orchestrator notification-service sse-bridge-pool; do
          echo "Waiting for consumer group $group..."
          timeout 120 bash -c "until docker compose exec -T kafka kafka-consumer-groups --bootstrap-server kafka:29092 --describe --group $group --state 2>/dev/null | grep -qw Stable; do sleep 2; done" || {
            docker compose exec -T kafka kafka-consumer-groups --bootstrap-server kafka:29092 --describe --all-groups --state
            exit 1
          }
        done
        # The worker's two subscribers join saga-orchestrator seconds apart, so Stable can come before execution_requested has its consumer
        echo "Waiting for a consumer on execution_requested..."
        timeout 120 bash -c "until docker compose exec -T kafka kafka-consumer-groups --bootstrap-server kafka:29092 --describe --group saga-orchestrator 2>/dev/null | awk '\$2 == \"execution_requested\" && \$7 != \"-\"' | grep -q .; do sleep 2; done" || {
          docker compose exec -T kafka kafka-consumer-groups --bootstrap-server kafka:29092 --describe --group saga-orchestrator
          exit 1
        }
        echo "Consumer groups ready"
        if [ "$WAIT_FOR_FRONTEND" = "true" ]; then
          echo "Waiting for frontend health..."
          timeout 60 bash -c 'until curl -ksf https://localhost:5001 2>/dev/null; do sleep 1; done'
          echo "Frontend ready"
        fi
