# --8<-- [start:core]
# Integr8sCode backend configuration (development defaults).
# Secrets (SECRET_KEY, MONGO_USER, MONGO_PASSWORD, REDIS_PASSWORD) come from
# environment variables with dev defaults (see Settings.__init__() in settings.py).
# Production: set env vars via docker-compose or GitHub Actions secrets.

PROJECT_NAME = "integr8scode"
ALGORITHM = "HS256"
ACCESS_TOKEN_EXPIRE_MINUTES = 1440

MONGO_HOST = "mongo"
MONGO_PORT = 27017
MONGO_DB   = "integr8scode"
# --8<-- [end:core]

# --8<-- [start:kubernetes]
KUBERNETES_CONFIG_PATH = "/etc/rancher/k3s/k3s.yaml"
K8S_POD_CPU_LIMIT = "1000m"
K8S_POD_MEMORY_LIMIT = "128Mi"
K8S_POD_CPU_REQUEST = "200m"
K8S_POD_MEMORY_REQUEST = "128Mi"
K8S_POD_EXECUTION_TIMEOUT = 5
K8S_NAMESPACE = "integr8scode"

SERVER_HOST = "0.0.0.0"
# --8<-- [end:kubernetes]

# --8<-- [start:kafka]
# Kafka
KAFKA_BOOTSTRAP_SERVERS = "kafka:29092"
KAFKA_REQUEST_TIMEOUT_MS = 40000
# --8<-- [end:kafka]

# --8<-- [start:sse]
# SSE
SSE_CONSUMER_POOL_SIZE = 10
# --8<-- [end:sse]

LOG_LEVEL = "INFO"

# --8<-- [start:tracing]
# Tracing
OTLP_TRACES_ENDPOINT = "http://otel-collector:4317"
TRACING_SAMPLING_RATE = 1.0
# --8<-- [end:tracing]

CORS_ORIGINS = [
    "https://app.integr8scode.cc",
    "https://integr8scode.cc",
    "https://localhost:5001",
    "https://127.0.0.1:5001",
    "https://localhost",
    "https://127.0.0.1",
    "https://localhost:443",
    "https://127.0.0.1:443",
]

# --8<-- [start:service]
SERVICE_NAME = "integr8scode-backend"
SERVICE_VERSION = "1.0.0"

# OpenTelemetry metrics export
OTEL_EXPORTER_OTLP_ENDPOINT = "http://otel-collector:4317"
# --8<-- [end:service]

# --8<-- [start:server]
# Gunicorn / Uvicorn
WEB_CONCURRENCY = 2
WEB_TIMEOUT = 60
WEB_BACKLOG = 2048

BCRYPT_ROUNDS = 12
REDIS_MAX_CONNECTIONS = 200
# --8<-- [end:server]
