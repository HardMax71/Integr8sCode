apiVersion: 1

datasources:
  # Victoria Metrics - High-performance time series database
  - name: Victoria Metrics
    type: prometheus
    uid: victoria-metrics
    access: proxy
    url: http://victoria-metrics:8428
    isDefault: true
    editable: true
    jsonData:
      httpMethod: POST
      exemplarTraceIdDestinations:
        - name: trace_id
          datasourceUid: jaeger

  # Jaeger for distributed tracing
  - name: Jaeger
    type: jaeger
    access: proxy
    url: http://jaeger:16686
    uid: jaeger
    editable: true

  # Loki for log aggregation
  - name: Loki
    type: loki
    uid: loki
    access: proxy
    url: http://loki:3100
    editable: true
    jsonData:
      # Loki keeps the OTLP record's trace_id as structured metadata, so the link matches that field, not the line
      derivedFields:
        - datasourceUid: jaeger
          matcherType: label
          matcherRegex: trace_id
          name: TraceID
          url: '$${__value.raw}'

  # OpenSearch, the same logs as Loki with every field indexed; the plugin is installed when Grafana starts
  - name: OpenSearch
    type: grafana-opensearch-datasource
    uid: opensearch
    access: proxy
    url: http://opensearch:9200
    editable: true
    jsonData:
      flavor: opensearch
      version: "3.9.0"
      # One index a day, so a search reads only the days in its time range
      database: "[logs-]YYYY.MM.DD"
      interval: Daily
      timeField: "@timestamp"
      logMessageField: body
      logLevelField: severity.text
      pplEnabled: true
      dataLinks:
        - field: traceId
          url: '$${__value.raw}'
          datasourceUid: jaeger
