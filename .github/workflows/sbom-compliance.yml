name: SBOM & Supply Chain Security

on:
  push:
    branches: [ main ]
  # Report-only and not required, so a path filter is fine: a PR scans only when it changes dependencies
  pull_request:
    branches: [ main ]
    paths:
      - 'backend/pyproject.toml'
      - 'backend/uv.lock'
      - 'frontend/package.json'
      - 'frontend/package-lock.json'
      - '.github/workflows/sbom-compliance.yml'
  schedule:
    - cron: '0 0 * * 0'  # Run weekly on Sundays

permissions:
  contents: read
  security-events: write

jobs:
  sbom-analysis:
    name: Generate & Scan SBOMs
    runs-on: ubuntu-latest
    strategy:
      matrix:
        component: [backend, frontend]
        include:
          - component: backend
            path: ./backend
            type: python
          - component: frontend
            path: ./frontend
            type: javascript

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Generate SBOM (${{ matrix.component }})
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c  # v0.24.3
        id: sbom
        with:
          path: ${{ matrix.path }}
          format: spdx-json
          output-file: ${{ matrix.component }}-sbom.spdx.json
          upload-artifact: false

      - name: Scan SBOM for Vulnerabilities
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439  # v7.4.2
        id: scan
        with:
          sbom: ${{ matrix.component }}-sbom.spdx.json
          fail-build: false # Don't block builds yet, just report
          severity-cutoff: high

      - name: Upload SBOM Artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: ${{ matrix.component }}-sbom
          path: ${{ matrix.component }}-sbom.spdx.json
          retention-days: 5

      - name: Upload Vulnerability Report
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee  # v4.39.0
        if: always()
        with:
          sarif_file: ${{ steps.scan.outputs.sarif }}
          category: ${{ matrix.component }}-dependencies
