name: Generated API

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  generated:
    name: Spec and client match the code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: "backend/uv.lock"

      - name: Install backend dependencies
        run: |
          cd backend
          uv python install 3.14
          uv sync --frozen --no-dev --no-install-project --no-build

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: '26'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --ignore-scripts

      - name: Regenerate the spec and the client
        run: |
          ./deploy.sh openapi
          cd frontend && npm run generate:api

      - name: Fail on any difference
        run: |
          changes=$(git status --porcelain -- docs/reference/openapi.json frontend/src/lib/api)
          if [ -n "$changes" ]; then
            echo "::error::docs/reference/openapi.json and frontend/src/lib/api must come from the generators, never from hand edits. Run ./deploy.sh openapi, then ./deploy.sh types, and commit the result."
            echo "$changes"
            git diff --stat -- docs/reference/openapi.json frontend/src/lib/api
            exit 1
          fi
