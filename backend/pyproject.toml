    "pyasn1==0.6.4",
    "pyasn1_modules==0.4.2",
    "pydantic==2.14.0",
    "pydantic_core==2.50.0",
    "Pygments==2.21.0",
    "PyJWT==2.15.1",
    "pymongo==4.18.3",
    "python-dateutil==2.9.0.post0",
    "python-multipart==0.0.32",
    "PyYAML==6.0.3",
    "redis==8.1.0",
    "requests==2.34.2",
