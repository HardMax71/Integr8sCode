# Dependabot configuration
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
# Updates merge themselves once CI passes and reach prod with the nightly deploy, so each release waits 7 days in case it gets yanked
updates:
  # Python dependencies (uv/pip)
  - package-ecosystem: "uv"
    directory: "/backend"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "deps(python)"
    groups:
      python:
        patterns: ["*"]

  # Frontend npm dependencies
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "deps(npm)"
    groups:
      npm:
        patterns: ["*"]
    ignore:
      # typescript-eslint and svelte-check need the compiler API that TypeScript 7 dropped
      - dependency-name: "typescript"
        versions: [">=7.0.0"]

  # Docker base images, one entry so one group covers both Dockerfiles
  - package-ecosystem: "docker"
    directories:
      - "/backend"
      - "/frontend"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "deps(docker)"
    groups:
      docker:
        patterns: ["*"]

  # Images referenced in docker-compose.yaml
  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "deps(docker)"
    groups:
      docker-compose:
        patterns: ["*"]
    ignore:
      # Grafana can't search Jaeger 2.21+ yet (grafana/grafana#112336)
      - dependency-name: "jaegertracing/jaeger"
        versions: [">=2.21.0"]

  # GitHub Actions, including the composite actions
  - package-ecosystem: "github-actions"
    directories:
      - "/"
      - "/.github/actions/*"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "deps(actions)"
    groups:
      github-actions:
        patterns: ["*"]
