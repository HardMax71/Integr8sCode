x-logging: &logging
  driver: fluentd
  options:
    # async: a container still starts, and buffers its lines, while the collector is down or not in the profile
    fluentd-address: localhost:24224
    fluentd-async: "true"
    tag: "{{.Name}}"
    # docker logs reads Docker's local cache of the same lines, kept as small as the old local driver's files
    cache-max-size: "10m"
    cache-max-file: "3"

# Secrets have no defaults: ./deploy.sh dev copies .env.example to .env, and the production deploy writes .env from its secrets
x-backend-secrets: &backend-secrets
  SECRET_KEY: ${SECRET_KEY:?see .env.example}
  MONGO_USER: ${MONGO_USER:?see .env.example}
  MONGO_PASSWORD: ${MONGO_PASSWORD:?see .env.example}
  REDIS_PASSWORD: ${REDIS_PASSWORD:?see .env.example}

services:
  mongo:
    logging: *logging
    image: mongo:9.0.4
    command: ["mongod", "--wiredTigerCacheSizeGB", "0.4"]
    ports:
      - "127.0.0.1:27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:?see .env.example}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:?see .env.example}
      MONGO_INITDB_DATABASE: integr8scode
    volumes:
      - mongo_data:/data/db
    networks:
      - app-network
    container_name: mongo
    mem_limit: 1024m
    restart: unless-stopped
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    healthcheck:
      test: mongosh --quiet --host 127.0.0.1 --port 27017 -u "$$MONGO_INITDB_ROOT_USERNAME" -p "$$MONGO_INITDB_ROOT_PASSWORD" --authenticationDatabase admin --eval 'db.adminCommand("ping")'
      interval: 3s
      timeout: 5s
      retries: 15
      start_period: 5s

  redis:
    logging: *logging
    image: redis:8.10.2-alpine
    container_name: redis
    ports:
      - "127.0.0.1:6379:6379"
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru --save "" --requirepass ${REDIS_PASSWORD:?see .env.example}
    volumes:
      - redis_data:/data
    networks:
      - app-network
    mem_limit: 300m
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:?see .env.example}", "--no-auth-warning", "ping"]
      interval: 2s
      timeout: 3s
      retries: 10
      start_period: 2s

  backend:
    logging: *logging
    image: ghcr.io/hardmax71/integr8scode/backend:${IMAGE_TAG:-latest}
    build:
      context: ./backend
      dockerfile: Dockerfile
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    volumes:
      - ./backend/app:/app/app
      - ./backend/scripts:/app/scripts
      - ./backend/tests:/app/tests:ro
      - ./backend/config.test.toml:/app/config.test.toml:ro
      - ./backend/config.toml:/app/config.toml:ro
      - backend_tls_key:/app/certs/key
      - backend_tls_cert:/app/certs/cert
    ports:
      - "127.0.0.1:443:443"
    networks:
      - app-network
    container_name: backend
    environment:
      <<: *backend-secrets
      ADMIN_USER_PASSWORD: ${ADMIN_USER_PASSWORD:?see .env.example}
      DEFAULT_USER_PASSWORD: ${DEFAULT_USER_PASSWORD:?see .env.example}
      MONGO_MONITOR_USER: ${MONGO_MONITOR_USER:-otel-monitor}
      MONGO_MONITOR_PASSWORD: ${MONGO_MONITOR_PASSWORD:?see .env.example}
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-2}
      WEB_THREADS: ${WEB_THREADS:-4}
      WEB_TIMEOUT: ${WEB_TIMEOUT:-60}
    mem_limit: 768m
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f -s --cacert /app/certs/cert/server.crt https://localhost:443/api/v1/health/live >/dev/null || exit 1"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 3s

  frontend:
    logging: *logging
    image: ghcr.io/hardmax71/integr8scode/frontend:${IMAGE_TAG:-latest}
    container_name: frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
    depends_on:
      # nginx loads the backend's certificate when it starts, so the backend has to have made it
      backend:
        condition: service_healthy
    volumes:
      - backend_tls_cert:/etc/nginx/backend:ro
    ports:
      - "5001:5001"
    networks:
      - app-network
    environment:
      - BACKEND_URL=https://backend:443
      - GRAFANA_URL=${GRAFANA_URL:-http://grafana:3000}
      - GRAFANA_PUBLIC_URL=${GRAFANA_ROOT_URL:-http://localhost:3000/}
    mem_limit: 128m
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -k -f -s https://localhost:5001 >/dev/null || exit 1"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 3s


  grafana:
    logging: *logging
    container_name: grafana
    profiles: ["observability"]
    image: grafana/grafana:13.2.3
    user: "472"
    # Alert rules load after dashboards create the integr8scode folder; loaded first, they'd make one with a random UID
    entrypoint:
      - sh
      - -c
      - |
        grafana-cli --homepath /usr/share/grafana admin reset-admin-password "$$GF_SECURITY_ADMIN_PASSWORD" > /dev/null 2>&1 || true
        rm -rf /tmp/provisioning && cp -r /etc/grafana/provisioning /tmp/provisioning
        rm -f /tmp/provisioning/alerting/*
        GF_PATHS_PROVISIONING=/tmp/provisioning /run.sh &
        pid=$$!
        trap 'kill -TERM $$pid' TERM INT
        auth="$$GF_SECURITY_ADMIN_USER:$$GF_SECURITY_ADMIN_PASSWORD"
        until curl -sf -u "$$auth" localhost:3000/api/folders/integr8scode > /dev/null; do
          kill -0 $$pid 2> /dev/null || exit 1
          sleep 2
        done
        cp /etc/grafana/provisioning/alerting/* /tmp/provisioning/alerting/
        curl -sf -X POST -u "$$auth" localhost:3000/api/admin/provisioning/alerting/reload > /dev/null || exit 1
        wait $$pid
        wait $$pid
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./backend/grafana/grafana.ini:/etc/grafana/grafana.ini:ro
      - ./backend/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    networks:
      - app-network
    mem_limit: 512m  # Grafana 13 idles near 300 MiB
    restart: unless-stopped
    depends_on:
      victoria-metrics:
        condition: service_healthy
      jaeger:
        condition: service_started
      loki:
        condition: service_started
    environment:
      - GF_LOG_LEVEL=warn
      - GF_SERVER_ROOT_URL=${GRAFANA_ROOT_URL:-http://localhost:3000/}
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?see .env.example}
      - GF_SMTP_HOST=${GF_SMTP_HOST:-}
      - GF_SMTP_USER=${MAILJET_API_KEY:-}
      - GF_SMTP_PASSWORD=${MAILJET_SECRET_KEY:-}
      - GF_SMTP_FROM_ADDRESS=${MAILJET_FROM_ADDRESS:-noreply@integr8scode.cc}
      - GF_SMTP_ALERT_RECIPIENTS=${GRAFANA_ALERT_RECIPIENTS:-noreply@integr8scode.cc}
    healthcheck:
      test: ["CMD-SHELL", "curl -f localhost:3000/api/health && echo 'ready'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # Kafka in KRaft mode, no ZooKeeper
  kafka:
    logging: *logging
    image: confluentinc/cp-kafka:8.3.2
    container_name: kafka
    ports:
      - "127.0.0.1:9092:9092"
      - "127.0.0.1:29092:29092"
    environment:
      # KRaft identity (combined broker + controller)
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'

      # Listeners
      KAFKA_LISTENERS: 'PLAINTEXT://kafka:29092,CONTROLLER://kafka:29093,PLAINTEXT_HOST://0.0.0.0:9092'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'

      # Single-node replication
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1

      # Topic management
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
      KAFKA_DELETE_TOPIC_ENABLE: 'true'
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_LOG_RETENTION_HOURS: 168

      # Production settings
      KAFKA_COMPRESSION_TYPE: 'gzip'
      KAFKA_NUM_NETWORK_THREADS: 8
      KAFKA_NUM_IO_THREADS: 8
      KAFKA_SOCKET_SEND_BUFFER_BYTES: 102400
      KAFKA_SOCKET_RECEIVE_BUFFER_BYTES: 102400
      KAFKA_SOCKET_REQUEST_MAX_BYTES: 104857600

      # Log settings
      KAFKA_LOG_SEGMENT_BYTES: 1073741824
      KAFKA_LOG_RETENTION_CHECK_INTERVAL_MS: 300000
      KAFKA_LOG_CLEANUP_POLICY: 'delete'

      # JVM settings
      KAFKA_HEAP_OPTS: '-Xms256m -Xmx1g'
      KAFKA_JVM_PERFORMANCE_OPTS: '-server -XX:+UseG1GC -XX:MaxGCPauseMillis=20 -XX:InitiatingHeapOccupancyPercent=35 -XX:+ExplicitGCInvokesConcurrent -Djava.awt.headless=true'
    volumes:
      - kafka_data:/var/lib/kafka/data
      - kafka_logs:/var/log/kafka
    networks:
      - app-network
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    mem_limit: 1280m
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092"]
      interval: 3s
      timeout: 10s
      retries: 15
      start_period: 3s

  kafdrop:
    logging: *logging
    image: obsidiandynamics/kafdrop:4.3.0
    container_name: kafdrop
    profiles: ["debug"]
    depends_on:
      - kafka
    ports:
      - "127.0.0.1:9000:9000"
    environment:
      KAFKA_BROKERCONNECT: kafka:29092
      JVM_OPTS: "-Xms256M -Xmx512M"
    networks:
      - app-network

  # Kafka consumers, the pod watch and the scheduled jobs
  worker:
    logging: *logging
    image: ghcr.io/hardmax71/integr8scode/backend:${IMAGE_TAG:-latest}
    container_name: worker
    mem_limit: 256m
    command: ["python", "-m", "app.worker"]
    depends_on:
      # healthy means the backend has run scripts.seed_users, data fixes included
      backend:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      <<: *backend-secrets
    volumes:
      - ./backend/app:/app/app:ro
      # k3s's own kubeconfig; the folder, so a missing file never turns into a directory
      - /etc/rancher/k3s:/etc/rancher/k3s:ro
      - ./backend/config.toml:/app/config.toml:ro
      - ./backend/config.worker.toml:/app/config.worker.toml:ro
    networks:
      - app-network
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  # Distributed tracing with Jaeger
  jaeger:
    logging: *logging
    # 2.21+ dropped the search API Grafana's Jaeger datasource calls (grafana/grafana#112336)
    image: jaegertracing/jaeger:2.20.0
    container_name: jaeger
    profiles: ["observability"]
    mem_limit: 256m
    # OTLP 4317/4318 stays internal on app-network
    ports:
      - "127.0.0.1:6831:6831/udp"   # Jaeger Thrift compact
      - "127.0.0.1:6832:6832/udp"   # Jaeger Thrift binary
      - "127.0.0.1:5778:5778"       # Remote sampling (HTTP)
      - "127.0.0.1:16686:16686"     # Jaeger UI and query API
      - "127.0.0.1:14268:14268"     # Jaeger Thrift over HTTP
      - "127.0.0.1:14250:14250"     # Jaeger gRPC (model.proto)
      - "127.0.0.1:9411:9411"       # Zipkin
    networks:
      - app-network
    restart: unless-stopped

  loki:
    logging: *logging
    container_name: loki
    profiles: ["observability"]
    image: grafana/loki:3.7.8
    ports:
      - "127.0.0.1:3100:3100"
    volumes:
      - ./backend/loki/loki-config.yaml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - app-network
    mem_limit: 256m
    restart: unless-stopped
    # Distroless image with no shell, so no healthcheck

  # Monitoring Stack
  # Victoria Metrics - Time series database
  victoria-metrics:
    logging: *logging
    image: victoriametrics/victoria-metrics:v1.153.0
    container_name: victoria-metrics
    profiles: ["observability"]
    mem_limit: 256m
    ports:
      - "127.0.0.1:8428:8428"
    volumes:
      - victoria_metrics_data:/victoria-metrics-data
      - ./backend/victoria-metrics/scrape.yaml:/etc/victoria-metrics/scrape.yaml:ro
    command:
      - "--storageDataPath=/victoria-metrics-data"
      - "--httpListenAddr=0.0.0.0:8428"
      - "--retentionPeriod=30d"
      - "--promscrape.config=/etc/victoria-metrics/scrape.yaml"
    networks:
      - app-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8428/-/healthy"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  # OpenTelemetry Collector
  otel-collector:
    # Its own output stays local: sent to itself, the debug exporter's lines would come back forever
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
    image: otel/opentelemetry-collector-contrib:0.162.0
    container_name: otel-collector
    profiles: ["observability"]
    mem_limit: 192m
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./backend/otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
      - /proc:/hostfs/proc:ro
      - /sys:/hostfs/sys:ro
    environment:
      # The backend creates this user on start; until then the mongodb receiver's scrapes fail and retry
      - MONGO_MONITOR_USER=${MONGO_MONITOR_USER:-otel-monitor}
      - MONGO_MONITOR_PASSWORD=${MONGO_MONITOR_PASSWORD:?see .env.example}
    ports:
      - "127.0.0.1:4317:4317"   # OTLP gRPC
      - "127.0.0.1:4318:4318"   # OTLP HTTP
      - "127.0.0.1:13133:13133" # Health check
      - "127.0.0.1:24224:24224" # Fluent forward, where Docker's log driver sends every container's output
    networks:
      - app-network
    depends_on:
      victoria-metrics:
        condition: service_healthy
      jaeger:
        condition: service_started
      loki:
        condition: service_started
      kafka:
        condition: service_healthy
    restart: unless-stopped

# --8<-- [start:dev_volumes]
volumes:
  mongo_data:
  redis_data:
  backend_tls_key:
  backend_tls_cert:
  grafana_data:
  victoria_metrics_data:
  loki_data:
  kafka_data:
  kafka_logs:
# --8<-- [end:dev_volumes]

networks:
  app-network:
    driver: bridge
