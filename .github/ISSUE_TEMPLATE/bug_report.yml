name: Bug Report
description: Report unexpected behavior or errors
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Search the existing issues first. A security weakness goes through [private reporting](https://github.com/HardMax71/Integr8sCode/security/advisories/new), not a public issue.

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: What happened?
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What you expected to happen.
    validations:
      required: true

  - type: dropdown
    id: component
    attributes:
      label: Component
      description: Which part of the system is affected?
      options:
        - Frontend (UI)
        - API (routes, auth, rate limits, settings)
        - Running scripts (queue, pods, results)
        - Kafka events (consumers, DLQ, replay)
        - Live updates and notifications
        - Metrics, dashboards and logs
        - Deployment (compose, production)
        - CI and tooling
        - Documentation
        - Not sure
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Whatever applies.
      placeholder: |
        - Where: local dev (docker compose up) or production
        - Version: release tag or commit, e.g. 2026.10.3 or 7b9f060
        - Script language and version, e.g. Go 1.27
        - Browser, e.g. Firefox 145
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs
      description: Include any error messages or logs (use code blocks).
      render: shell
    validations:
      required: false

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I have searched existing issues to ensure this is not a duplicate
          required: true
        - label: I have included steps to reproduce the issue
          required: true
