receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
  
  # Collect host metrics
  host_metrics:
    collection_interval: 10s
    root_path: /hostfs
    scrapers:
      cpu:
        metrics:
          system.cpu.utilization:
            enabled: true
      disk:
      filesystem:
        exclude_mount_points:
          mount_points: ["^(/hostfs)?/boot", "^(/hostfs)?/var/lib/kubelet"]
          match_type: regexp
      load:
      memory:
        metrics:
          system.memory.utilization:
            enabled: true
      network:
      paging:
      processes:

  kafka_metrics:
    brokers: ["kafka:29092"]
    protocol_version: 3.0.0
    collection_interval: 15s
    initial_delay: 5s
    scrapers:
      - brokers
      - topics
      - consumers

  mongodb:
    hosts:
      - endpoint: mongo:27017
    username: ${env:MONGO_MONITOR_USER}
    password: ${env:MONGO_MONITOR_PASSWORD}
    # standalone mongod: replica-set discovery would fail with NoReplicationEnabled
    direct_connection: true
    # mongo runs without TLS; the receiver attempts a TLS handshake unless told otherwise
    tls:
      insecure: true
    collection_interval: 15s
    initial_delay: 10s
    metrics:
      mongodb.health:
        enabled: true
      mongodb.uptime:
        enabled: true
      mongodb.page_faults:
        enabled: true
      mongodb.operation.latency.time:
        enabled: true
      mongodb.active.reads:
        enabled: true
      mongodb.active.writes:
        enabled: true
      mongodb.commands.rate:
        enabled: true
      mongodb.deletes.rate:
        enabled: true
      mongodb.flushes.rate:
        enabled: true
      mongodb.getmores.rate:
        enabled: true
      mongodb.inserts.rate:
        enabled: true
      mongodb.queries.rate:
        enabled: true
      mongodb.updates.rate:
        enabled: true
      mongodb.lock.acquire.count:
        enabled: true
      mongodb.lock.acquire.wait_count:
        enabled: true
      mongodb.wtcache.bytes.read:
        enabled: true

# Metrics the app used to record by hand, made from the spans it sends (#389)
connectors:
  forward/sampling:

  signaltometrics:
    spans:
      - name: queue.enqueue
        description: Executions put in the queue
        unit: "{execution}"
        conditions:
          - span.name == "queue.enqueue"
        sum:
          value: "1"
          monotonic: true
      - name: queue.schedule
        description: Executions moved from the queue into a running slot
        unit: "{execution}"
        conditions:
          - span.name == "queue.schedule" and span.attributes["queue.outcome"] == "scheduled"
        sum:
          value: "1"
          monotonic: true
      - name: queue.event_data_lost
        description: Executions dropped because their event data had expired in Redis
        unit: "{execution}"
        conditions:
          - span.name == "queue.schedule" and span.attributes["queue.outcome"] == "event_data_lost"
        sum:
          value: "1"
          monotonic: true
      - name: queue.wait_time
        description: Time an execution waited in the queue before it was scheduled
        unit: s
        attributes:
          - key: queue.priority
        conditions:
          - span.name == "queue.schedule" and span.attributes["queue.outcome"] == "scheduled"
        histogram:
          buckets: [0.1, 0.5, 1, 2, 5, 10, 30, 60, 120, 300, 600, 1800, 3600]
          value: Double(span.attributes["queue.wait_seconds"])
      # The scheduler job reads both from Redis every 10 s, so they stay right across restarts
      - name: queue.depth
        description: Executions waiting in the queue
        unit: "{execution}"
        conditions:
          - span.name == "queue.schedule_pending"
        gauge:
          value: Int(span.attributes["queue.depth"])
      - name: queue.active
        description: Executions holding a running slot
        unit: "{execution}"
        conditions:
          - span.name == "queue.schedule_pending"
        gauge:
          value: Int(span.attributes["queue.active"])

processors:
  batch:
    timeout: 10s
    send_batch_size: 1024
  
  memory_limiter:
    check_interval: 1s
    limit_mib: 150
    spike_limit_mib: 40

  tail_sampling:
    decision_wait: 10s
    num_traces: 50000
    policies:
      - name: error-traces
        type: status_code
        status_code:
          status_codes: [ERROR]
      - name: slow-traces
        type: latency
        latency:
          threshold_ms: 1000
      - name: base-rate
        type: probabilistic
        probabilistic:
          sampling_percentage: 10
  
  # signaltometrics emits deltas, and Prometheus remote write only takes cumulative series
  deltatocumulative:

  resource:
    attributes:
      - key: service.namespace
        value: integr8scode
        action: insert

exporters:
  # Export to Jaeger for traces via OTLP
  otlp_grpc/jaeger:
    endpoint: jaeger:4317
    tls:
      insecure: true
  
  # Export metrics to Victoria Metrics via Prometheus Remote Write
  # Victoria Metrics is a Prometheus-compatible time series database
  prometheus_remote_write:
    endpoint: http://victoria-metrics:8428/api/v1/write
    tls:
      insecure: true
    # Every resource attribute becomes a label
    resource_constant_labels:
      included: ["*"]
  
  # Export logs to Loki via OTLP
  otlp_http/loki:
    endpoint: http://loki:3100/otlp
    tls:
      insecure: true

  # Console logging for debugging
  debug:
    verbosity: normal
    sampling_initial: 10
    sampling_thereafter: 100

extensions:
  health_check:
    endpoint: 0.0.0.0:13133
  
  pprof:
    endpoint: 0.0.0.0:1777
  
  zpages:
    endpoint: 0.0.0.0:55679

service:
  extensions: [health_check, pprof, zpages]
  
  pipelines:
    # signaltometrics sees every span; tail sampling only decides what Jaeger keeps
    traces:
      receivers: [otlp]
      processors: [memory_limiter]
      exporters: [signaltometrics, forward/sampling]

    traces/sampled:
      receivers: [forward/sampling]
      processors: [tail_sampling, batch, resource]
      exporters: [otlp_grpc/jaeger, debug]
    
    metrics:
      receivers: [otlp, host_metrics, kafka_metrics, mongodb, signaltometrics]
      processors: [memory_limiter, deltatocumulative, batch, resource]
      exporters: [prometheus_remote_write, debug]
    
    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch, resource]
      exporters: [otlp_http/loki, debug]