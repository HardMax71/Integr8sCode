receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

  # Every container's stdout and stderr, from Docker's fluentd log driver; the tag is the container name
  fluent_forward:
    endpoint: 0.0.0.0:24224
  
  # Collect host metrics
  host_metrics:
    collection_interval: 10s
    root_path: /hostfs
    scrapers:
      cpu:
        metrics:
          system.cpu.utilization:
            enabled: true
      disk:
      filesystem:
        exclude_mount_points:
          mount_points: ["^(/hostfs)?/boot", "^(/hostfs)?/var/lib/kubelet"]
          match_type: regexp
      load:
      memory:
        metrics:
          system.memory.utilization:
            enabled: true
      network:
      paging:
      processes:

  kafka_metrics:
    brokers: ["kafka:29092"]
    protocol_version: 3.0.0
    collection_interval: 15s
    initial_delay: 5s
    scrapers:
      - brokers
      - topics
      - consumers

  mongodb:
    hosts:
      - endpoint: mongo:27017
    username: ${env:MONGO_MONITOR_USER}
    password: ${env:MONGO_MONITOR_PASSWORD}
    # standalone mongod: replica-set discovery would fail with NoReplicationEnabled
    direct_connection: true
    # mongo runs without TLS; the receiver attempts a TLS handshake unless told otherwise
    tls:
      insecure: true
    collection_interval: 15s
    initial_delay: 10s
    metrics:
      mongodb.health:
        enabled: true
      mongodb.uptime:
        enabled: true
      mongodb.page_faults:
        enabled: true
      mongodb.operation.latency.time:
        enabled: true
      mongodb.active.reads:
        enabled: true
      mongodb.active.writes:
        enabled: true
      mongodb.commands.rate:
        enabled: true
      mongodb.deletes.rate:
        enabled: true
      mongodb.flushes.rate:
        enabled: true
      mongodb.getmores.rate:
        enabled: true
      mongodb.inserts.rate:
        enabled: true
      mongodb.queries.rate:
        enabled: true
      mongodb.updates.rate:
        enabled: true
      mongodb.lock.acquire.count:
        enabled: true
      mongodb.lock.acquire.wait_count:
        enabled: true
      mongodb.wtcache.bytes.read:
        enabled: true

# Metrics the app used to record by hand, made from the spans it sends (#389)
connectors:
  forward/sampling:

  signaltometrics:
    spans:
      - name: queue.enqueue
        description: Executions put in the queue
        unit: "{execution}"
        conditions:
          - span.name == "queue.enqueue"
        sum:
          value: "1"
          monotonic: true
      - name: queue.schedule
        description: Executions moved from the queue into a running slot
        unit: "{execution}"
        conditions:
          - span.name == "queue.schedule" and span.attributes["queue.outcome"] == "scheduled"
        sum:
          value: "1"
          monotonic: true
      - name: queue.event_data_lost
        description: Executions dropped because their event data had expired in Redis
        unit: "{execution}"
        conditions:
          - span.name == "queue.schedule" and span.attributes["queue.outcome"] == "event_data_lost"
        sum:
          value: "1"
          monotonic: true
      - name: queue.wait_time
        description: Time an execution waited in the queue before it was scheduled
        unit: s
        attributes:
          - key: queue.priority
        conditions:
          - span.name == "queue.schedule" and span.attributes["queue.outcome"] == "scheduled"
        histogram:
          buckets: [0.1, 0.5, 1, 2, 5, 10, 30, 60, 120, 300, 600, 1800, 3600]
          value: Double(span.attributes["queue.wait_seconds"])
      # The scheduler job reads both from Redis every 10 s, so they stay right across restarts
      - name: queue.depth
        description: Executions waiting in the queue
        unit: "{execution}"
        conditions:
          - span.name == "queue.schedule_pending"
        gauge:
          value: Int(span.attributes["queue.depth"])
      - name: queue.active
        description: Executions holding a running slot
        unit: "{execution}"
        conditions:
          - span.name == "queue.schedule_pending"
        gauge:
          value: Int(span.attributes["queue.active"])
      - name: dlq.messages.received
        description: Failed events saved to the DLQ
        unit: "{message}"
        attributes:
          - key: dlq.original_topic
          - key: dlq.event_type
        conditions:
          - span.name == "dlq.handle" and span.attributes["dlq.outcome"] == "stored"
        sum:
          value: "1"
          monotonic: true
      - name: dlq.message.age
        description: How old a failed event was when the DLQ saved it
        unit: s
        conditions:
          - span.name == "dlq.handle" and span.attributes["dlq.outcome"] == "stored"
        histogram:
          buckets: [1, 10, 60, 300, 900, 3600, 21600, 86400, 604800]
          value: Double(span.attributes["dlq.message_age_seconds"])
      - name: dlq.messages.retried
        description: DLQ messages republished to their topic, by result
        unit: "{message}"
        attributes:
          - key: dlq.original_topic
          - key: dlq.event_type
          - key: dlq.retry_result
        conditions:
          - span.name == "dlq.retry"
        sum:
          value: "1"
          monotonic: true
      - name: dlq.processing.errors
        description: DLQ retries whose publish failed, by error type
        unit: "{message}"
        attributes:
          - key: dlq.original_topic
          - key: dlq.event_type
          - key: dlq.error_type
        conditions:
          - span.name == "dlq.retry" and span.attributes["dlq.retry_result"] == "failed"
        sum:
          value: "1"
          monotonic: true
      - name: dlq.messages.discarded
        description: DLQ messages given up on, by reason
        unit: "{message}"
        attributes:
          - key: dlq.original_topic
          - key: dlq.event_type
          - key: dlq.discard_reason
        conditions:
          - span.name == "dlq.discard"
        sum:
          value: "1"
          monotonic: true
      - name: dlq.processing.duration
        description: Time to handle, retry or discard one DLQ message
        unit: s
        attributes:
          - key: dlq.operation
        conditions:
          - span.attributes["dlq.operation"] != nil
        histogram:
          buckets: [0.005, 0.01, 0.025, 0.05, 0.1, 0.25, 0.5, 1, 2.5, 5]
          value: Seconds(span.end_time - span.start_time)
      # The monitoring job reports every topic that still has messages every 10 s; a drained topic stops reporting
      - name: dlq.queue.size
        description: Messages waiting in the DLQ, by topic
        unit: "{message}"
        attributes:
          - key: dlq.original_topic
        conditions:
          - span.name == "dlq.queue_size"
        gauge:
          value: Int(span.attributes["dlq.size"])
      - name: script.executions
        description: Executions by status, counted at submission (queued, error) and at the result (completed, failed, timeout)
        unit: "{execution}"
        attributes:
          - key: execution.status
          - key: execution.lang_and_version
        conditions:
          - span.name == "execution.submit" or span.name == "execution.result"
        sum:
          value: "1"
          monotonic: true
      - name: script.errors
        description: Executions that ended in an error, by error type
        unit: "{execution}"
        attributes:
          - key: execution.error_type
        conditions:
          - span.attributes["execution.error_type"] != nil
        sum:
          value: "1"
          monotonic: true
      - name: script.execution.duration
        description: Wall time of a finished execution, or the timeout of one that timed out
        unit: s
        attributes:
          - key: execution.lang_and_version
        conditions:
          - span.name == "execution.result" and span.attributes["execution.runtime_seconds"] != nil
        histogram:
          buckets: [0.1, 0.25, 0.5, 1, 2.5, 5, 10, 30, 60, 120, 300]
          value: Double(span.attributes["execution.runtime_seconds"])
      - name: script.memory.usage
        description: Peak memory of a completed execution
        unit: MiB
        attributes:
          - key: execution.lang_and_version
        conditions:
          - span.name == "execution.result" and span.attributes["execution.memory_mib"] != nil
        histogram:
          buckets: [4, 8, 16, 32, 64, 128, 256, 512, 1024]
          value: Double(span.attributes["execution.memory_mib"])
      - name: script.memory.utilization.percent
        description: Peak memory of a completed execution as a share of its limit
        unit: "%"
        attributes:
          - key: execution.lang_and_version
        conditions:
          - span.name == "execution.result" and span.attributes["execution.memory_percent"] != nil
        histogram:
          buckets: [1, 5, 10, 25, 50, 75, 90, 100]
          value: Double(span.attributes["execution.memory_percent"])
      - name: pod.creations
        description: Executor pod creation attempts by result
        unit: "{pod}"
        attributes:
          - key: pod.creation_result
          - key: pod.language
        conditions:
          - span.name == "pod.create"
        sum:
          value: "1"
          monotonic: true
      - name: pod.creation.duration
        description: Time to create the ConfigMap and pod and publish pod_created
        unit: s
        attributes:
          - key: pod.language
        conditions:
          - span.name == "pod.create" and span.attributes["pod.creation_result"] == "success"
        histogram:
          buckets: [0.05, 0.1, 0.25, 0.5, 1, 2.5, 5, 10, 30]
          value: Seconds(span.end_time - span.start_time)
      # The k8s worker reports it as each creation ends, so it goes stale once creations stop
      - name: pod.creations.active
        description: Pod creations still running in the k8s worker
        unit: "{pod}"
        conditions:
          - span.name == "pod.create"
        gauge:
          value: Int(span.attributes["pod.active_creations"])
      - name: configmaps.created
        description: Executor ConfigMap creations by result
        unit: "{configmap}"
        attributes:
          - key: pod.configmap_result
        conditions:
          - span.name == "pod.create_configmap"
        sum:
          value: "1"
          monotonic: true
      - name: pod.lifetime
        description: Time from pod creation until the pod monitor saw the execution finish
        unit: s
        attributes:
          - key: pod.phase
          - key: pod.language
        conditions:
          - span.name == "pod_monitor.event" and span.attributes["pod.lifetime_seconds"] != nil
        histogram:
          buckets: [1, 5, 10, 30, 60, 120, 300, 600, 1800, 3600]
          value: Double(span.attributes["pod.lifetime_seconds"])
      # The pod monitor reports every phase, zeros included, at the end of each watch (at most 35 s apart)
      - name: pods.by.phase
        description: Executor pods the pod monitor currently sees, by phase
        unit: "{pod}"
        attributes:
          - key: pod.phase
        conditions:
          - span.name == "pod_monitor.pods"
        gauge:
          value: Int(span.attributes["pod_monitor.pods"])
      - name: pod.monitor.events
        description: Events the pod monitor published
        unit: "{event}"
        attributes:
          - key: pod_monitor.watch_event
          - key: pod.phase
        conditions:
          - span.name == "pod_monitor.event" and span.attributes["pod_monitor.published"] != nil
        sum:
          value: Int(span.attributes["pod_monitor.published"])
          monotonic: true
      - name: pod.monitor.processing.duration
        description: Time to map one watch event and publish what it produced
        unit: s
        attributes:
          - key: pod_monitor.watch_event
        conditions:
          - span.name == "pod_monitor.event"
        histogram:
          buckets: [0.001, 0.005, 0.01, 0.025, 0.05, 0.1, 0.25, 0.5, 1, 2.5]
          value: Seconds(span.end_time - span.start_time)
      - name: pod.monitor.reconciliations
        description: Full pod lists, on the first watch and after the cursor expired
        unit: "{list}"
        conditions:
          - span.name == "pod_monitor.list"
        sum:
          value: "1"
          monotonic: true
      - name: pod.monitor.watch.errors
        description: Watches that ended in an error, and pod events that failed to process
        unit: "{error}"
        attributes:
          - key: pod_monitor.error_type
        conditions:
          - span.attributes["pod_monitor.error_type"] != nil
        sum:
          value: "1"
          monotonic: true
      - name: pod.monitor.watch.reconnects
        description: Watches that ended in an error, so the next cycle starts a new one
        unit: "{watch}"
        conditions:
          - span.name == "pod_monitor.watch" and span.attributes["pod_monitor.error_type"] != nil
        sum:
          value: "1"
          monotonic: true
      - name: notifications.sent
        description: Notifications delivered
        unit: "{notification}"
        attributes:
          - key: notification.category
        conditions:
          - span.name == "notification.deliver" and span.attributes["notification.result"] == "delivered"
        sum:
          value: "1"
          monotonic: true
      - name: notifications.by.channel
        description: Notifications delivered, by channel
        unit: "{notification}"
        attributes:
          - key: notification.channel
          - key: notification.category
        conditions:
          - span.name == "notification.deliver" and span.attributes["notification.result"] == "delivered"
        sum:
          value: "1"
          monotonic: true
      - name: notifications.by.severity
        description: Notifications delivered, by severity
        unit: "{notification}"
        attributes:
          - key: notification.severity
          - key: notification.category
        conditions:
          - span.name == "notification.deliver" and span.attributes["notification.result"] == "delivered"
        sum:
          value: "1"
          monotonic: true
      - name: notifications.failed
        description: Notifications that failed every delivery attempt
        unit: "{notification}"
        attributes:
          - key: notification.category
          - key: notification.error
        conditions:
          - span.name == "notification.deliver" and span.attributes["notification.result"] == "failed"
        sum:
          value: "1"
          monotonic: true
      - name: notification.channel.failures
        description: Notifications that failed every delivery attempt, by channel
        unit: "{notification}"
        attributes:
          - key: notification.channel
          - key: notification.error
        conditions:
          - span.name == "notification.deliver" and span.attributes["notification.result"] == "failed"
        sum:
          value: "1"
          monotonic: true
      - name: notification.delivery.time
        description: Time to deliver a notification, retries included
        unit: s
        attributes:
          - key: notification.category
        conditions:
          - span.name == "notification.deliver" and span.attributes["notification.delivery_seconds"] != nil
        histogram:
          buckets: [0.001, 0.005, 0.01, 0.025, 0.05, 0.1, 0.25, 0.5, 1, 2.5, 5, 10, 30]
          value: Double(span.attributes["notification.delivery_seconds"])
      - name: notification.channel.delivery.time
        description: Time to deliver a notification, retries included, by channel
        unit: s
        attributes:
          - key: notification.channel
          - key: notification.category
        conditions:
          - span.name == "notification.deliver" and span.attributes["notification.delivery_seconds"] != nil
        histogram:
          buckets: [0.001, 0.005, 0.01, 0.025, 0.05, 0.1, 0.25, 0.5, 1, 2.5, 5, 10, 30]
          value: Double(span.attributes["notification.delivery_seconds"])
      - name: notifications.throttled
        description: Notifications held back by the per-user throttle
        unit: "{notification}"
        attributes:
          - key: notification.category
        conditions:
          - span.name == "notification.throttled"
        sum:
          value: "1"
          monotonic: true
      - name: notification.retries
        description: Delivery attempts that failed and were retried
        unit: "{retry}"
        attributes:
          - key: notification.category
          - key: notification.channel
        conditions:
          - span.name == "notification.retry"
        sum:
          value: "1"
          monotonic: true
      - name: notification.subscription.changes
        description: Subscription updates, by channel and action
        unit: "{change}"
        attributes:
          - key: notification.channel
          - key: notification.action
        conditions:
          - span.name == "notification.subscription_change"
        sum:
          value: "1"
          monotonic: true
      - name: replay.sessions.created
        description: Replay sessions created
        unit: "{session}"
        attributes:
          - key: replay.type
          - key: replay.target
        conditions:
          - span.name == "replay.session_created"
        sum:
          value: "1"
          monotonic: true
      - name: replay.status.changes
        description: Replay session status changes
        unit: "{change}"
        attributes:
          - key: replay.from_status
          - key: replay.to_status
        conditions:
          - span.name == "replay.status_change"
        sum:
          value: "1"
          monotonic: true
      - name: replay.events.processed
        description: Events replayed
        unit: "{event}"
        attributes:
          - key: replay.type
          - key: replay.event_type
        conditions:
          - span.name == "replay.event" and span.attributes["replay.result"] == "replayed"
        sum:
          value: "1"
          monotonic: true
      - name: replay.events.failed
        description: Events that failed to replay
        unit: "{event}"
        attributes:
          - key: replay.type
          - key: replay.event_type
        conditions:
          - span.name == "replay.event" and span.attributes["replay.result"] == "failed"
        sum:
          value: "1"
          monotonic: true
      - name: replay.event.processing.time
        description: Time to replay one event, retries included
        unit: s
        attributes:
          - key: replay.event_type
        conditions:
          - span.name == "replay.event"
        histogram:
          buckets: [0.001, 0.005, 0.01, 0.025, 0.05, 0.1, 0.25, 0.5, 1, 2.5, 5]
          value: Double(span.attributes["replay.processing_seconds"])
      - name: replay.delay.applied
        description: Wait before the next event, from the original gap over the speed multiplier
        unit: s
        conditions:
          - span.name == "replay.event" and span.attributes["replay.delay_seconds"] != nil
        histogram:
          buckets: [0.01, 0.1, 0.5, 1, 5, 10, 30, 60, 300]
          value: Double(span.attributes["replay.delay_seconds"])
      - name: replay.batch.size
        description: Events loaded per batch
        unit: "{event}"
        attributes:
          - key: replay.type
        conditions:
          - span.name == "replay.batch"
        histogram:
          buckets: [1, 10, 50, 100, 250, 500, 1000]
          value: Double(span.attributes["replay.batch_size"])
      - name: replay.duration
        description: Time from start to completion of a completed session
        unit: s
        attributes:
          - key: replay.type
        conditions:
          - span.name == "replay.session_completed"
        histogram:
          buckets: [1, 5, 10, 30, 60, 300, 600, 1800, 3600]
          value: Double(span.attributes["replay.duration_seconds"])
      - name: replay.throughput
        description: Events per second of a completed session
        unit: event/s
        attributes:
          - key: replay.type
        conditions:
          - span.name == "replay.session_completed" and span.attributes["replay.throughput"] != nil
        histogram:
          buckets: [1, 5, 10, 50, 100, 500, 1000, 5000]
          value: Double(span.attributes["replay.throughput"])
      - name: replay.speed.multiplier
        description: Speed multiplier of each started session
        unit: x
        attributes:
          - key: replay.type
        conditions:
          - span.name == "replay.session_started"
        histogram:
          buckets: [0.5, 1, 2, 5, 10, 50, 100]
          value: Double(span.attributes["replay.speed_multiplier"])
      - name: replay.by.target
        description: Events sent to each replay target, by success
        unit: "{event}"
        attributes:
          - key: replay.target
          - key: replay.target_success
        conditions:
          - span.name == "replay.target"
        sum:
          value: "1"
          monotonic: true
      - name: replay.target.errors
        description: Events a replay target failed to take
        unit: "{event}"
        attributes:
          - key: replay.target
        conditions:
          - span.name == "replay.target" and span.attributes["replay.target_success"] == false
        sum:
          value: "1"
          monotonic: true
      # The API reports these every 10 s from the sessions it holds in memory
      - name: replay.sessions.by.status
        description: Replay sessions the API holds, by status
        unit: "{session}"
        attributes:
          - key: replay.status
        conditions:
          - span.name == "replay.sessions"
        gauge:
          value: Int(span.attributes["replay.sessions"])
      - name: replay.queue.size
        description: Loaded events still to send, over all sessions
        unit: "{event}"
        conditions:
          - span.name == "replay.report"
        gauge:
          value: Int(span.attributes["replay.queued_events"])
      - name: authentication.attempts
        description: Password logins, by success
        unit: "{attempt}"
        attributes:
          - key: auth.method
          - key: auth.success
        conditions:
          - span.name == "auth.login"
        sum:
          value: "1"
          monotonic: true
      - name: authentication.failures
        description: Password logins that failed
        unit: "{attempt}"
        attributes:
          - key: auth.method
        conditions:
          - span.name == "auth.login" and span.attributes["auth.success"] == false
        sum:
          value: "1"
          monotonic: true
      - name: authentication.duration
        description: Time to check a password login
        unit: s
        attributes:
          - key: auth.method
        conditions:
          - span.name == "auth.login"
        histogram:
          buckets: [0.01, 0.05, 0.1, 0.25, 0.5, 1, 2.5, 5]
          value: Seconds(span.end_time - span.start_time)
      - name: token.validation.failures
        description: Access tokens rejected, by reason
        unit: "{token}"
        attributes:
          - key: auth.reason
        conditions:
          - span.name == "auth.token_rejected"
        sum:
          value: "1"
          monotonic: true
      - name: csrf.validation.failures
        description: Requests rejected by the CSRF check, by reason
        unit: "{request}"
        attributes:
          - key: auth.reason
        conditions:
          - span.name == "auth.csrf_rejected"
        sum:
          value: "1"
          monotonic: true
      - name: authorization.checks
        description: Admin route checks, by result
        unit: "{check}"
        attributes:
          - key: auth.resource
          - key: auth.action
          - key: auth.allowed
          - key: auth.user_role
        conditions:
          - span.name == "auth.authorization"
        sum:
          value: "1"
          monotonic: true
      - name: authorization.denials
        description: Admin route checks that denied access
        unit: "{check}"
        attributes:
          - key: auth.resource
          - key: auth.action
          - key: auth.user_role
        conditions:
          - span.name == "auth.authorization" and span.attributes["auth.allowed"] == false
        sum:
          value: "1"
          monotonic: true
      - name: password.reset.requests
        description: Password resets
        unit: "{reset}"
        attributes:
          - key: auth.method
        conditions:
          - span.name == "auth.password_reset"
        sum:
          value: "1"
          monotonic: true
      - name: weak.password.attempts
        description: Registrations refused for a weak password
        unit: "{attempt}"
        attributes:
          - key: auth.weakness_type
        conditions:
          - span.name == "auth.weak_password"
        sum:
          value: "1"
          monotonic: true
      - name: brute.force.attempts
        description: Logins against an account that is already locked
        unit: "{attempt}"
        conditions:
          - span.name == "auth.locked_login"
        sum:
          value: "1"
          monotonic: true
      - name: accounts.locked
        description: Accounts locked after too many failed logins
        unit: "{account}"
        attributes:
          - key: auth.reason
        conditions:
          - span.name == "auth.account_locked"
        sum:
          value: "1"
          monotonic: true
      - name: rate_limit.requests
        description: Requests the rate limiter checked, by algorithm
        unit: "{request}"
        attributes:
          - key: rate_limit.endpoint
          - key: rate_limit.authenticated
          - key: rate_limit.algorithm
        conditions:
          - span.name == "rate_limit.request"
        sum:
          value: "1"
          monotonic: true
      - name: rate_limit.allowed
        description: Requests a rate limit rule let through
        unit: "{request}"
        attributes:
          - key: rate_limit.endpoint
          - key: rate_limit.group
        conditions:
          - span.name == "rate_limit.decision" and span.attributes["rate_limit.allowed"] == true
        sum:
          value: "1"
          monotonic: true
      - name: rate_limit.rejected
        description: Requests a rate limit rule rejected
        unit: "{request}"
        attributes:
          - key: rate_limit.endpoint
          - key: rate_limit.group
        conditions:
          - span.name == "rate_limit.decision" and span.attributes["rate_limit.allowed"] == false
        sum:
          value: "1"
          monotonic: true
      - name: rate_limit.bypass
        description: Requests from users who bypass rate limits
        unit: "{request}"
        attributes:
          - key: rate_limit.endpoint
        conditions:
          - span.name == "rate_limit.request" and span.attributes["rate_limit.algorithm"] == "bypassed"
        sum:
          value: "1"
          monotonic: true
      - name: events.published
        description: Events stored and published by the producer
        unit: "{event}"
        attributes:
          - key: event.type
        conditions:
          - span.name == "publish_event" and span.status.code != STATUS_CODE_ERROR
        sum:
          value: "1"
          monotonic: true
      - name: event.processing.duration
        description: Time to store an event and publish it to Kafka
        unit: s
        attributes:
          - key: event.type
        conditions:
          - span.name == "publish_event" and span.status.code != STATUS_CODE_ERROR
        histogram:
          buckets: [0.001, 0.005, 0.01, 0.025, 0.05, 0.1, 0.25, 0.5, 1, 2.5]
          value: Seconds(span.end_time - span.start_time)
      - name: idempotency.cache.hits
        description: Idempotency checks that found the key already stored
        unit: "{check}"
        attributes:
          - key: idempotency.event_type
          - key: idempotency.operation
        conditions:
          - span.name == "idempotency.check" and span.attributes["idempotency.result"] == "hit"
        sum:
          value: "1"
          monotonic: true
      - name: idempotency.cache.misses
        description: Idempotency checks that reserved a new key
        unit: "{check}"
        attributes:
          - key: idempotency.event_type
          - key: idempotency.operation
        conditions:
          - span.name == "idempotency.check" and span.attributes["idempotency.result"] == "miss"
        sum:
          value: "1"
          monotonic: true
      - name: idempotency.duplicates.blocked
        description: Events skipped because their key was done or still in progress
        unit: "{event}"
        attributes:
          - key: idempotency.event_type
        conditions:
          - span.name == "idempotency.duplicate_blocked"
        sum:
          value: "1"
          monotonic: true
      - name: idempotency.check.duration
        description: Time to look up and reserve an idempotency key
        unit: s
        attributes:
          - key: idempotency.operation
        conditions:
          - span.name == "idempotency.check"
        histogram:
          buckets: [0.0005, 0.001, 0.0025, 0.005, 0.01, 0.025, 0.05, 0.1, 0.25]
          value: Seconds(span.end_time - span.start_time)
      - name: idempotency.processing.duration
        description: Time from reserving an idempotency key to marking it completed or failed
        unit: s
        attributes:
          - key: idempotency.event_type
          - key: idempotency.status
        conditions:
          - span.name == "idempotency.processed"
        histogram:
          buckets: [0.01, 0.05, 0.1, 0.5, 1, 5, 10, 30, 60, 300]
          value: Double(span.attributes["idempotency.processing_seconds"])
      # The worker counts the keys in Redis every 30 s
      - name: idempotency.keys.active
        description: Idempotency keys currently stored in Redis
        unit: "{key}"
        conditions:
          - span.name == "idempotency.keys"
        gauge:
          value: Int(span.attributes["idempotency.active_keys"])
      # Each API process reports its own open streams every 10 s, zeros included
      - name: sse.connections.active
        description: Open SSE streams, by endpoint
        unit: "{connection}"
        attributes:
          - key: sse.endpoint
        conditions:
          - span.name == "sse.streams"
        gauge:
          value: Int(span.attributes["sse.open_streams"])
      - name: sse.messages.sent
        description: Messages sent down SSE streams, by endpoint and event type
        unit: "{message}"
        attributes:
          - key: sse.endpoint
          - key: sse.event_type
        conditions:
          - span.name == "sse.message"
        sum:
          value: "1"
          monotonic: true
      - name: sse.connection.duration
        description: How long an SSE stream stayed open
        unit: s
        attributes:
          - key: sse.endpoint
        conditions:
          - span.name == "sse.stream_closed"
        histogram:
          buckets: [1, 5, 10, 30, 60, 300, 600, 1800, 3600, 7200]
          value: Double(span.attributes["sse.duration_seconds"])

processors:
  batch:
    timeout: 10s
    send_batch_size: 1024
  
  memory_limiter:
    check_interval: 1s
    limit_mib: 150
    spike_limit_mib: 40

  tail_sampling:
    decision_wait: 10s
    num_traces: 50000
    policies:
      - name: error-traces
        type: status_code
        status_code:
          status_codes: [ERROR]
      - name: slow-traces
        type: latency
        latency:
          threshold_ms: 1000
      - name: base-rate
        type: probabilistic
        probabilistic:
          sampling_percentage: 10
  
  # signaltometrics emits deltas; keep each total for a day so an idle counter doesn't restart from zero
  deltatocumulative:
    max_stale: 24h

  # Split signaltometrics output: counters and histograms are scraped, gauges go by remote write
  filter/no_gauges:
    error_mode: ignore
    metrics:
      metric:
        - type == METRIC_DATA_TYPE_GAUGE
  filter/gauges_only:
    error_mode: ignore
    metrics:
      metric:
        - type != METRIC_DATA_TYPE_GAUGE

  resource:
    attributes:
      - key: service.namespace
        value: integr8scode
        action: insert

  # The backend and worker send their structlog JSON over OTLP already, so only their other output (gunicorn, tracebacks) comes from stdout
  filter/app_json_stdout:
    error_mode: ignore
    logs:
      log_record:
        - IsMatch(log.attributes["fluent.tag"], "^(backend|worker)$") and IsMatch(log.body, "^\\{")

  # One resource per container, named after it, so Loki labels each container's lines with their own service_name
  groupbyattrs/container:
    keys: [fluent.tag]

  transform/container:
    error_mode: ignore
    log_statements:
      - context: resource
        statements:
          - set(resource.attributes["service.name"], resource.attributes["fluent.tag"]) where resource.attributes["fluent.tag"] != nil

exporters:
  # Export to Jaeger for traces via OTLP
  otlp_grpc/jaeger:
    endpoint: jaeger:4317
    tls:
      insecure: true
  
  # Export metrics to Victoria Metrics via Prometheus Remote Write
  # Victoria Metrics is a Prometheus-compatible time series database
  prometheus_remote_write:
    endpoint: http://victoria-metrics:8428/api/v1/write
    tls:
      insecure: true
    # Every resource attribute becomes a label
    resource_constant_labels:
      included: ["*"]
  
  # Serves the last value on every scrape, so a counter with no new spans still gets points
  prometheus:
    endpoint: 0.0.0.0:8889
    metric_expiration: 24h
    resource_to_telemetry_conversion:
      enabled: true

  # Export logs to Loki via OTLP
  otlp_http/loki:
    endpoint: http://loki:3100/otlp
    tls:
      insecure: true

  # Console logging for debugging
  debug:
    verbosity: normal
    sampling_initial: 10
    sampling_thereafter: 100

extensions:
  health_check:
    endpoint: 0.0.0.0:13133
  
  pprof:
    endpoint: 0.0.0.0:1777
  
  zpages:
    endpoint: 0.0.0.0:55679

service:
  extensions: [health_check, pprof, zpages]
  
  pipelines:
    # signaltometrics sees every span; tail sampling only decides what Jaeger keeps
    traces:
      receivers: [otlp]
      processors: [memory_limiter]
      exporters: [signaltometrics, forward/sampling]

    traces/sampled:
      receivers: [forward/sampling]
      processors: [tail_sampling, batch, resource]
      exporters: [otlp_grpc/jaeger, debug]
    
    metrics:
      receivers: [otlp, host_metrics, kafka_metrics, mongodb]
      processors: [memory_limiter, batch, resource]
      exporters: [prometheus_remote_write, debug]

    # VictoriaMetrics scrapes these every 15 s, see backend/victoria-metrics/scrape.yaml
    metrics/span_counts:
      receivers: [signaltometrics]
      processors: [memory_limiter, filter/no_gauges, deltatocumulative, batch, resource]
      exporters: [prometheus]

    metrics/span_gauges:
      receivers: [signaltometrics]
      processors: [memory_limiter, filter/gauges_only, batch, resource]
      exporters: [prometheus_remote_write]
    
    logs:
      receivers: [otlp, fluent_forward]
      processors: [memory_limiter, filter/app_json_stdout, groupbyattrs/container, transform/container, batch, resource]
      exporters: [otlp_http/loki, debug]