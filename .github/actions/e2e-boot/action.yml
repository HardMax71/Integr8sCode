name: 'E2E Boot'
description: 'Kick off slow background tasks: GHCR auth, image pull + infra pre-warm, k3s in a container'

inputs:
  image-tag:
    description: 'GHCR image tag (e.g., sha-abc1234)'
    required: true
  github-token:
    description: 'GitHub token for GHCR authentication'
    required: true

runs:
  using: 'composite'
  steps:
    - name: Log in to GHCR
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ inputs.github-token }}

    - name: Pull images and pre-warm infra (background)
      shell: bash
      env:
        IMAGE_TAG: ${{ inputs.image-tag }}
      run: |
        cp .env.example .env
        nohup bash -c '
          IMAGE_TAG='"$IMAGE_TAG"' docker compose pull --quiet --include-deps frontend worker mongo-backup 2>&1
          echo "--- pull done, starting infra ---"
          docker compose up -d --no-build \
            mongo redis kafka 2>&1
          echo $? > /tmp/infra-pull.exit
        ' > /tmp/infra-pull.log 2>&1 &
        echo $! > /tmp/infra-pull.pid

    # Pods get their network interfaces inside this container, so the runner's network and the test browser never see them come and go
    - name: Start k3s in a container
      shell: bash
      run: |
        sudo mkdir -p /etc/rancher/k3s
        docker run -d --name k3s --privileged -p 6443:6443 \
          -v /etc/rancher/k3s:/etc/rancher/k3s -e K3S_KUBECONFIG_MODE=644 \
          "$K3S_IMAGE" server --disable=traefik --disable-network-policy --tls-san host.docker.internal

    - name: Pre-pull executor images (background)
      shell: bash
      run: |
        # No docker exec before k3s writes its kubeconfig: one during its root cgroup evacuation kills the kubelet
        nohup bash -c '
          timeout 120 bash -c "until [ -s /etc/rancher/k3s/k3s.yaml ] && docker exec k3s crictl info >/dev/null 2>&1; do sleep 2; done"
          docker exec k3s crictl pull docker.io/library/python:3.14-slim
          echo $? > /tmp/crictl-python.exit
        ' > /tmp/crictl-python.log 2>&1 &
        echo $! > /tmp/crictl-python.pid
