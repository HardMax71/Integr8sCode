[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[dependency-groups]
test = [
    "coverage==7.16.2",
    "hypothesis==6.168.5",
    "iniconfig==2.3.1",
    "pluggy==1.6.0",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-cov==7.1.0",
    "pytest-env==1.7.1",
    "pytest-timeout==2.4.0",
    "pytest-xdist==3.8.0",
]
lint = [
    "mypy==2.4.0",
    "mypy_extensions==1.1.0",
    "ruff==0.17.0",
    "grimp>=3.17",
]
load = [
    "matplotlib==3.11.2",
    "Pillow>=12.3.0",
]
dev = [
    { include-group = "test" },
    { include-group = "lint" },
    { include-group = "load" },
    "pipdeptree==4.2.6",
]

# Ruff configuration
[tool.ruff]
lint.select = ["E", "F", "B", "I", "W"]
lint.ignore = ["W293"]
line-length = 120
target-version = "py314"
exclude = [
    "grafana",
    "prometheus",
    "**/venv/**",
    "**/.venv/**",
    "**/site-packages/**",
    "**/.claude/**",
]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.params.Depends", "fastapi.Query", "fastapi.params.Query"]

[tool.ruff.lint.flake8-annotations]
mypy-init-return = true

# MyPy configuration
[tool.mypy]
python_version = "3.14"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
disable_error_code = ["import-untyped", "import-not-found"]
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# Pytest configuration
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "e2e: marks tests as end-to-end tests requiring full system",
    "unit: marks tests as unit tests",
    "slow: marks tests as slow running",
    "kafka: marks tests as requiring Kafka",
    "mongodb: marks tests as requiring MongoDB",
    "redis: marks tests as requiring Redis",
    "k8s: marks tests as requiring Kubernetes",
    "performance: marks tests as performance tests",
    "admin: marks tests as admin-only functionality tests",
    "grafana_contract: marks tests as Grafana dashboard contract tests",
]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
log_cli = false
log_cli_level = "ERROR"
log_level = "ERROR"
addopts = "--tb=short -n auto --dist=loadgroup"
timeout = 120
timeout_method = "signal"

# pytest-env: Sets env vars before test execution
[tool.pytest_env]
OTEL_SDK_DISABLED = "true"  # Prevents teardown delays from OTLP exporter retries

# Coverage configuration
[tool.coverage.run]
# Use sysmon for faster coverage (requires Python 3.12+)
core = "sysmon"
