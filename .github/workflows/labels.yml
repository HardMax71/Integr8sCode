name: Labels

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
  issues:
    types: [opened, edited]

permissions: {}

jobs:
  pull-request:
    name: Label PR by changed paths
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      # Reads .github/labeler.yml from main and the changed file list from the API; never checks out PR code
      - uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13  # v7.0.0

  issue:
    name: Label issue by component
    if: github.event_name == 'issues'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: github/issue-labeler@ccca1e16fcb66762200e616fc29b57b940c1cb67  # v3.5
        with:
          configuration-path: .github/issue-labeler.yml
          enable-versioned-regex: 0
