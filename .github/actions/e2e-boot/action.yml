name: 'E2E Boot'
description: 'Kick off slow background tasks: GHCR auth, image pull + infra pre-warm, k3s install'

inputs:
  image-tag:
    description: 'GHCR image tag (e.g., sha-abc1234)'
    required: true
  github-token:
    description: 'GitHub token for GHCR authentication'
    required: true

runs:
  using: 'composite'
  steps:
    - name: Log in to GHCR
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ inputs.github-token }}

    - name: Pull images and pre-warm infra (background)
      shell: bash
      env:
        IMAGE_TAG: ${{ inputs.image-tag }}
      run: |
        nohup bash -c '
          IMAGE_TAG='"$IMAGE_TAG"' docker compose pull --quiet 2>&1
          echo "--- pull done, starting infra ---"
          docker compose up -d --no-build \
            mongo redis shared-ca kafka 2>&1
          echo $? > /tmp/infra-pull.exit
        ' > /tmp/infra-pull.log 2>&1 &
        echo $! > /tmp/infra-pull.pid

    - name: Install k3s
      shell: bash
      run: |
        K3S_TAG=$(echo "$K3S_VERSION" | sed 's/+/%2B/g')
        curl --proto =https --tlsv1.2 -sfL "https://raw.githubusercontent.com/k3s-io/k3s/${K3S_TAG}/install.sh" -o /tmp/k3s-install.sh
        echo "$K3S_INSTALL_SHA256  /tmp/k3s-install.sh" | sha256sum -c -
        chmod +x /tmp/k3s-install.sh
        INSTALL_K3S_VERSION="$K3S_VERSION" INSTALL_K3S_EXEC="--disable=traefik --bind-address 0.0.0.0 --tls-san host.docker.internal" /tmp/k3s-install.sh

    - name: Pre-pull executor images and Kueue manifest (background)
      shell: bash
      run: |
        KUEUE_VERSION="${KUEUE_VERSION:-v0.20.1}"

        nohup bash -c '
          curl --proto =https --tlsv1.2 -fsSL -o /tmp/kueue-manifests.yaml \
            "https://github.com/kubernetes-sigs/kueue/releases/download/'"$KUEUE_VERSION"'/manifests.yaml"
          echo $? > /tmp/kueue-download.exit
        ' > /tmp/kueue-download.log 2>&1 &
        echo $! > /tmp/kueue-download.pid

        nohup bash -c '
          sudo k3s crictl pull docker.io/library/python:3.11-slim \
            && sudo k3s crictl pull docker.io/library/python:3.14-slim
          echo $? > /tmp/crictl-python.exit
        ' > /tmp/crictl-python.log 2>&1 &
        echo $! > /tmp/crictl-python.pid
