name: Release & Deploy

on:
  schedule:
    - cron: '0 23 * * *'
      timezone: 'Europe/Berlin'
  workflow_dispatch:
    inputs:
      skip_deploy:
        description: 'Skip deployment (release only)'
        required: false
        type: boolean
        default: false

concurrency:
  group: release-deploy
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  release:
    name: Create CalVer Release
    if: github.ref_name == 'main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      new: ${{ steps.version.outputs.new }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install crane
        uses: imjasonh/setup-crane@feee3b6bb0d4c68370f256a4502498c9227e5c6b  # v0.7

      # latest is the newest build that passed CI and the scan, which can be behind main's head
      - name: Find the commit latest was built from
        id: sha
        run: |
          IMG="$REGISTRY/${GITHUB_REPOSITORY_OWNER,,}/integr8scode/backend"
          LATEST=$(crane digest "$IMG:latest")
          for SHA in $(git rev-list -n 100 HEAD); do
            if [ "$(crane digest "$IMG:sha-${SHA::7}" 2>/dev/null)" = "$LATEST" ]; then
              echo "sha=$SHA" >> "$GITHUB_OUTPUT"
              echo "short-sha=${SHA::7}" >> "$GITHUB_OUTPUT"
              echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "::error::backend:latest matches none of the last 100 commits on main"
          exit 1

      - name: Pick the version
        id: version
        run: |
          SHA="${{ steps.sha.outputs.sha }}"
          git fetch --tags --force
          RELEASED=$(git tag --points-at "$SHA" | grep -E '^[0-9]{4}\.[0-9]+\.[0-9]+$' | sort -V | tail -1 || true)
          if [ -n "$RELEASED" ]; then
            echo "version=$RELEASED" >> $GITHUB_OUTPUT
            echo "new=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          YEAR=$(date +%Y)
          MONTH=$(date +%-m)
          PATTERN="^${YEAR}\.${MONTH}\.[0-9]+$"
          HIGHEST=$(git tag -l | grep -E "$PATTERN" | \
            awk -F. '{print $3}' | sort -n | tail -1)

          if [ -z "$HIGHEST" ]; then
            PATCH=0
          else
            PATCH=$((HIGHEST + 1))
          fi

          echo "version=${YEAR}.${MONTH}.${PATCH}" >> $GITHUB_OUTPUT
          echo "new=true" >> $GITHUB_OUTPUT

      - name: Tag images with CalVer version
        if: steps.version.outputs.new == 'true'
        run: |
          PREFIX="${GITHUB_REPOSITORY_OWNER,,}/integr8scode"
          VERSION="${{ steps.version.outputs.version }}"
          TAG="sha-${{ steps.sha.outputs.short-sha }}"
          for img in backend frontend; do
            crane copy "$REGISTRY/$PREFIX/$img:$TAG" "$REGISTRY/$PREFIX/$img:$VERSION"
          done

      - name: Create Git tag
        if: steps.version.outputs.new == 'true'
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$VERSION" "${{ steps.sha.outputs.sha }}" -m "Release $VERSION"
          git push origin "$VERSION"

      - name: Create GitHub Release
        if: steps.version.outputs.new == 'true'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64  # v3.0.3
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: ${{ steps.version.outputs.version }}
          generate_release_notes: true
          body: |
            **Commit**: `${{ steps.sha.outputs.short-sha }}`

            ### Docker Images

            ```
            docker pull ghcr.io/${{ steps.sha.outputs.owner }}/integr8scode/backend:${{ steps.version.outputs.version }}
            docker pull ghcr.io/${{ steps.sha.outputs.owner }}/integr8scode/frontend:${{ steps.version.outputs.version }}
            ```

  deploy:
    name: Deploy to Production
    needs: [release]
    if: >
      (github.event_name == 'schedule' && needs.release.outputs.new == 'true') ||
      (github.event_name == 'workflow_dispatch' && !inputs.skip_deploy)
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2  # v1.2.5
        env:
          IMAGE_TAG: ${{ needs.release.outputs.version }}
          GRAFANA_ADMIN_USER: ${{ secrets.GRAFANA_ADMIN_USER }}
          GRAFANA_ADMIN_PASSWORD: ${{ secrets.GRAFANA_ADMIN_PASSWORD }}
          MAILJET_API_KEY: ${{ secrets.MAILJET_API_KEY }}
          MAILJET_SECRET_KEY: ${{ secrets.MAILJET_SECRET_KEY }}
          MAILJET_FROM_ADDRESS: ${{ secrets.MAILJET_FROM_ADDRESS }}
          MAILJET_HOST: ${{ secrets.MAILJET_HOST }}
          GRAFANA_ALERT_RECIPIENTS: ${{ secrets.GRAFANA_ALERT_RECIPIENTS }}
          REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
          MONGO_USER: ${{ secrets.MONGO_USER }}
          MONGO_PASSWORD: ${{ secrets.MONGO_PASSWORD }}
          MONGO_MONITOR_PASSWORD: ${{ secrets.MONGO_MONITOR_PASSWORD }}
          SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}
          ADMIN_USER_PASSWORD: ${{ secrets.ADMIN_USER_PASSWORD }}
          DEFAULT_USER_PASSWORD: ${{ secrets.DEFAULT_USER_PASSWORD }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: IMAGE_TAG,GRAFANA_ADMIN_USER,GRAFANA_ADMIN_PASSWORD,MAILJET_API_KEY,MAILJET_SECRET_KEY,MAILJET_FROM_ADDRESS,MAILJET_HOST,GRAFANA_ALERT_RECIPIENTS,REDIS_PASSWORD,MONGO_USER,MONGO_PASSWORD,MONGO_MONITOR_PASSWORD,SECRET_KEY,ADMIN_USER_PASSWORD,DEFAULT_USER_PASSWORD
          command_timeout: 10m
          script: |
            set -e
            cd /opt/Integr8sCode

            # Images the running stack doesn't use; old tags can be pulled from GHCR again
            docker image prune -af || true

            # The server runs the compose file and config of the release, not whatever main has since
            git fetch --tags --force origin
            git checkout --detach "$IMAGE_TAG"

            # compose reads .env for every command, so the backup cron and commands run by hand get the same values; it refuses to start on an empty secret
            umask 077
            cat > .env <<EOF
            IMAGE_TAG='$IMAGE_TAG'
            COMPOSE_PROFILES=observability
            SECRET_KEY='$SECRET_KEY'
            MONGO_USER='$MONGO_USER'
            MONGO_PASSWORD='$MONGO_PASSWORD'
            MONGO_MONITOR_PASSWORD='$MONGO_MONITOR_PASSWORD'
            REDIS_PASSWORD='$REDIS_PASSWORD'
            ADMIN_USER_PASSWORD='$ADMIN_USER_PASSWORD'
            DEFAULT_USER_PASSWORD='$DEFAULT_USER_PASSWORD'
            GRAFANA_ROOT_URL='https://grafana.integr8scode.cc/'
            GRAFANA_ADMIN_USER='$GRAFANA_ADMIN_USER'
            GRAFANA_ADMIN_PASSWORD='$GRAFANA_ADMIN_PASSWORD'
            MAILJET_API_KEY='$MAILJET_API_KEY'
            MAILJET_SECRET_KEY='$MAILJET_SECRET_KEY'
            MAILJET_FROM_ADDRESS='$MAILJET_FROM_ADDRESS'
            GF_SMTP_HOST='$MAILJET_HOST'
            GRAFANA_ALERT_RECIPIENTS='$GRAFANA_ALERT_RECIPIENTS'
            EOF

            # k3s applies k8s/ (Kueue and its queues) by itself, and again whenever a release changes it
            ln -sfn /opt/Integr8sCode/k8s /var/lib/rancher/k3s/server/manifests/integr8scode

            docker compose pull
            docker compose up -d --remove-orphans --no-build --wait --wait-timeout 180

            echo "Backend healthy (IMAGE_TAG=$IMAGE_TAG)"

            docker image prune -af || true

  summary:
    name: Summary
    needs: [release, deploy]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Generate summary
        run: |
          echo "## Release & Deploy" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ needs.release.outputs.new }}" = "false" ]; then
            echo "- Nothing new since **${{ needs.release.outputs.version }}**" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ needs.release.result }}" = "success" ]; then
            echo "- Release **${{ needs.release.outputs.version }}** created" >> $GITHUB_STEP_SUMMARY
          else
            echo "- Release: **${{ needs.release.result }}**" >> $GITHUB_STEP_SUMMARY
          fi
          if [ "${{ needs.deploy.result }}" = "success" ]; then
            echo "- Deployed to production" >> $GITHUB_STEP_SUMMARY
          else
            echo "- Deploy: **${{ needs.deploy.result }}**" >> $GITHUB_STEP_SUMMARY
          fi
